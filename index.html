<style>
/* Layout: an operations board — summary tiles, then an alert strip, then tasks grouped by area; one column on phones. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#16202E; --muted:#5D6777; --line:#DCE0E6;
  --accent:#94652F; --accent-soft:#F3E9DC; --on-accent:#FFFFFF;
  --ok:#2E7A4D; --ok-soft:#E3F2E9; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#B23838; --bad-soft:#F9E3E3; --info:#2D5B9A; --info-soft:#E3ECF8;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F141B; --surface:#171E28; --sunk:#1E2633; --ink:#E7EBF0; --muted:#98A2B1; --line:#2A3441;
  --accent:#D3A065; --accent-soft:#3A2D1D; --on-accent:#1A1209;
  --ok:#62C08A; --ok-soft:#173025; --warn:#E3AA4F; --warn-soft:#352812; --bad:#EE7676; --bad-soft:#3A1C1C; --info:#86AAE2; --info-soft:#1A2840;
  color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.app{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.brand small{display:block;color:var(--accent);font-weight:600;font-size:13px}
.brand h1{font-size:clamp(22px,4vw,30px)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.status-line{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-line .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status-line.live .dot{background:var(--ok)}
.status-line.err .dot{background:var(--bad)}
.status-line button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;display:grid;gap:2px}
button.tile:hover{border-color:var(--accent)}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.info .v{color:var(--info)}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}

.alerts{display:grid;gap:6px}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:8px;font-size:14px;border-inline-start:4px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--info-soft);border-color:var(--info)}
.alert .links{display:flex;gap:6px;flex-wrap:wrap}
.alert button{background:none;border:0;padding:0;text-decoration:underline;color:inherit;font-size:14px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}

.group{display:grid;gap:8px}
.group-h{display:flex;align-items:baseline;gap:10px;padding-inline:2px}
.group-h h2{font-size:17px}
.group-h span{color:var(--muted);font-size:13px}
.list{display:grid;gap:6px}
#board{display:grid;gap:18px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-inline-start:4px solid var(--line)}
.task.overdue{border-inline-start-color:var(--bad)}
.task.today{border-inline-start-color:var(--warn)}
.task.done{border-inline-start-color:var(--ok)}
.task.done .t-title{color:var(--muted);text-decoration:line-through}
.t-main{min-width:0;display:grid;gap:4px;cursor:pointer;background:none;border:0;padding:0;text-align:start}
.t-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center}
.t-meta .due.bad{color:var(--bad);font-weight:600}
.t-meta .due.warn{color:var(--warn);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink)}
.prio{width:9px;height:9px;border-radius:50%;display:inline-block}
.prio.high{background:var(--bad)} .prio.mid{background:var(--warn)} .prio.low{background:var(--info)}
.t-side{display:flex;align-items:center;gap:10px}
.pbar{width:64px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
select.st{border-radius:999px;padding:4px 10px;border:1px solid transparent;font-size:13px;font-weight:500}
.st-todo{background:var(--sunk)} .st-doing{background:var(--info-soft);color:var(--info)} .st-wait{background:var(--warn-soft);color:var(--warn)} .st-done{background:var(--ok-soft);color:var(--ok)} .st-hold{background:var(--bad-soft);color:var(--bad)}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--on-accent)}
.task.done .check{background:var(--ok);border-color:var(--ok)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty h3{color:var(--ink);font-size:17px}

/* team-code gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(400px,100%);display:grid;gap:14px}
.gate small{color:var(--accent);font-weight:600;font-size:13px}
.gate h1{font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate .err{color:var(--bad);font-size:14px}

dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg{display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100dvh - 24px)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-h h2{font-size:18px}
.dlg-b{padding:16px 18px;overflow:auto;display:grid;gap:12px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.dlg-f .grp{display:flex;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f .field{color:var(--ink);font-size:15px;width:100%}
textarea.field{min-height:70px;resize:vertical}
.range-row{display:flex;gap:10px;align-items:center}
.range-row input{flex:1;accent-color:var(--accent)}
.cal-row{display:flex;gap:8px;flex-wrap:wrap}
.sec-title{font-family:var(--f-display);font-size:15px;font-weight:600;margin-top:4px}
.updates{display:grid;gap:8px}
.upd{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;display:grid;gap:2px}
.upd .who{font-size:12px;color:var(--muted)}
.upd-add{display:flex;gap:8px}
.upd-add input{flex:1;min-width:0}
.confirm{background:var(--bad-soft);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.audit{font-size:12px;color:var(--muted)}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px}

@media (max-width:820px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .task{grid-template-columns:auto minmax(0,1fr)}
  .t-side{grid-column:2;justify-content:space-between}
  .form-grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
const CFG=window.APP_CONFIG||{};
const STATUSES=[
  {v:"todo",l:"لم تبدأ",c:"st-todo"},
  {v:"doing",l:"قيد المتابعة",c:"st-doing"},
  {v:"wait",l:"بانتظار رد",c:"st-wait"},
  {v:"hold",l:"متوقفة",c:"st-hold"},
  {v:"done",l:"تم",c:"st-done"}];
const ST=Object.fromEntries(STATUSES.map(s=>[s.v,s]));
const PRIO={high:{l:"عالية",o:0},mid:{l:"متوسطة",o:1},low:{l:"منخفضة",o:2},"":{l:"",o:3}};
const REM={none:0,at:0,"1h":3600e3,"1d":86400e3};
const POLL_MS=15000;
const LS_CODE="altw.teamCode",LS_NAME="altw.name";

let code="",myName="";
let tasks=[],loaded=false,tileFilter="",editing=null,pollT=null,busy=false;

const $=id=>document.getElementById(id);
function el(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?"":v);}for(const k of kids){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}return e;}
function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
function pad(n){return String(n).padStart(2,"0")}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayIso(){return isoDate(new Date())}
function dueAt(t){if(!t.due)return null;const [y,m,d]=t.due.split("-").map(Number);let hh=23,mm=59;if(t.due_time){[hh,mm]=t.due_time.split(":").map(Number);}return new Date(y,m-1,d,hh,mm)}
function isOverdue(t){if(t.status==="done")return false;const d=dueAt(t);return !!d&&d<new Date()}
function isToday(t){return t.status!=="done"&&t.due===todayIso()&&!isOverdue(t)}
function remindAt(t){const d=dueAt(t);if(!d||!t.reminder||t.reminder==="none")return null;return new Date(d.getTime()-REM[t.reminder])}
const fmtDate=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short"});
const fmtDT=x=>new Date(x).toLocaleString("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function dueLabel(t){const d=dueAt(t);if(!d)return "بدون تاريخ";let s=fmtDate.format(d);if(t.due_time)s+=" · "+t.due_time;return s}
function toast(msg){$("toastText").textContent=msg;$("toast").hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>$("toast").hidden=true,2600)}
function setStatus(kind,text){$("statusLine").className="status-line"+(kind?" "+kind:"");$("statusText").textContent=text}

/* ---------- backend (Supabase RPC; every call carries the team code) ---------- */
class BadCode extends Error{}
async function rpc(fn,args){
  const res=await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{
    method:"POST",
    headers:Object.assign({"apikey":CFG.supabaseAnonKey,"Content-Type":"application/json"},
      /^eyJ/.test(CFG.supabaseAnonKey)?{"Authorization":"Bearer "+CFG.supabaseAnonKey}:{}), // publishable keys go in apikey only
    body:JSON.stringify({p_code:code,...args})});
  const text=await res.text();
  const body=text?JSON.parse(text):null;
  if(!res.ok){
    if(body&&(body.code==="28P01"||/bad_code/.test(body.message||"")))throw new BadCode("bad_code");
    throw new Error((body&&body.message)||("HTTP "+res.status));
  }
  return body;
}
function onErr(e){
  if(e instanceof BadCode){logout("كود الفريق تغيّر أو غير صحيح. اكتبه مرة ثانية.");return}
  toast("ما انحفظ، تأكد من الإنترنت وجرّب مرة ثانية");
}

/* ---------- load + poll ---------- */
async function load(quiet){
  if(busy)return;busy=true;
  try{
    tasks=await rpc("list_tasks",{});loaded=true;
    setStatus("live","متصل · يتحدث تلقائيًا كل 15 ثانية");
    refreshFilterOptions();render();
    if(editing){const t=tasks.find(x=>x.id===editing);if(!t){closeDlg();toast("المهمة انحذفت من عضو آخر")}else renderAudit(t)}
  }catch(e){
    if(e instanceof BadCode){busy=false;onErr(e);return}
    setStatus("err","ما قدرنا نوصل للبيانات، المعروض قد يكون قديم.");
    if(!loaded){loaded=true;render()}
  }
  busy=false;
}
function startPolling(){stopPolling();pollT=setInterval(()=>{if(document.visibilityState==="visible")load(true)},POLL_MS)}
function stopPolling(){if(pollT){clearInterval(pollT);pollT=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&code)load(true)});

/* ---------- filters ---------- */
function fillSelect(sel,opts,keep){const cur=keep?sel.value:"";sel.replaceChildren(...opts.map(([v,l])=>el("option",{value:v,text:l})));if(keep&&[...sel.options].some(o=>o.value===cur))sel.value=cur}
function areas(){return [...new Set(tasks.map(t=>t.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"))}
function owners(){return [...new Set(tasks.map(t=>t.owner).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"))}
function refreshFilterOptions(){
  fillSelect($("fStatus"),[["","كل الحالات"],["open","المفتوحة فقط"],...STATUSES.map(s=>[s.v,s.l])],true);
  fillSelect($("fArea"),[["","كل المحاور"],...areas().map(a=>[a,a])],true);
  fillSelect($("fOwner"),[["","كل المسؤولين"],...owners().map(a=>[a,a])],true);
  $("areaList").replaceChildren(...areas().map(a=>el("option",{value:a})));
  $("ownerList").replaceChildren(...owners().map(a=>el("option",{value:a})));
}
function filtered(){
  const q=$("q").value.trim().toLowerCase(),fs=$("fStatus").value,fa=$("fArea").value,fo=$("fOwner").value;
  return tasks.filter(t=>{
    if(q&&!((t.title||"")+" "+(t.notes||"")+" "+(t.owner||"")+" "+(t.area||"")).toLowerCase().includes(q))return false;
    if(fs==="open"&&t.status==="done")return false;
    if(fs&&fs!=="open"&&t.status!==fs)return false;
    if(fa&&t.area!==fa)return false;
    if(fo&&t.owner!==fo)return false;
    if(tileFilter==="open"&&t.status==="done")return false;
    if(tileFilter==="today"&&!isToday(t))return false;
    if(tileFilter==="overdue"&&!isOverdue(t))return false;
    if(tileFilter==="wait"&&t.status!=="wait")return false;
    return true;
  });
}
function sortTasks(list){
  const s=$("fSort").value;
  return list.slice().sort((a,b)=>{
    if((a.status==="done")!==(b.status==="done"))return a.status==="done"?1:-1;
    if(s==="prio"){const d=(PRIO[a.priority||""]||PRIO[""]).o-(PRIO[b.priority||""]||PRIO[""]).o;if(d)return d}
    if(s==="updated")return (b.updated_at||"").localeCompare(a.updated_at||"");
    const da=dueAt(a),dbb=dueAt(b);if(da&&dbb)return da-dbb;if(da)return -1;if(dbb)return 1;
    return (a.title||"").localeCompare(b.title||"","ar");
  });
}

/* ---------- render ---------- */
function render(){renderTiles();renderAlerts();renderBoard()}
function renderTiles(){
  const open=tasks.filter(t=>t.status!=="done").length;
  const today=tasks.filter(isToday).length;
  const over=tasks.filter(isOverdue).length;
  const wait=tasks.filter(t=>t.status==="wait").length;
  const pct=tasks.length?Math.round(tasks.reduce((s,t)=>s+(t.status==="done"?100:Number(t.progress)||0),0)/tasks.length):0;
  const tile=(key,v,k,cls)=>el("button",{type:"button",class:"tile "+(cls||"")+(tileFilter===key?" on":""),"aria-pressed":String(tileFilter===key),onclick:()=>{tileFilter=tileFilter===key?"":key;render()}},el("span",{class:"v",text:v}),el("span",{class:"k",text:k}));
  const pctTile=el("div",{class:"tile"},el("span",{class:"v",text:pct+"%"}),el("span",{class:"k",text:"نسبة الإنجاز"}),el("div",{class:"meter"},el("i",{style:"width:"+pct+"%"})));
  $("tiles").replaceChildren(tile("open",open,"مهام مفتوحة"),tile("today",today,"مستحقة اليوم","warn"),tile("overdue",over,"متأخرة","bad"),tile("wait",wait,"بانتظار رد","info"),pctTile);
}
function renderAlerts(){
  const box=$("alerts");box.replaceChildren();
  if(!loaded)return;
  const link=t=>el("button",{type:"button",onclick:()=>openTask(t.id),text:t.title});
  const over=tasks.filter(isOverdue),today=tasks.filter(isToday),now=new Date();
  const rem=tasks.filter(t=>{if(t.status==="done"||isOverdue(t)||isToday(t))return false;const r=remindAt(t);return r&&r<=now});
  const row=(cls,label,list)=>{if(!list.length)return;box.append(el("div",{class:"alert "+cls},el("b",{text:label+" ("+list.length+"):"}),el("span",{class:"links"},...list.slice(0,6).flatMap((t,i)=>i?["،",link(t)]:[link(t)])),list.length>6?el("span",{text:"و"+(list.length-6)+" غيرها"}):null))};
  row("bad","متأخرة",over);row("warn","مستحقة اليوم",today);row("info","حان وقت التذكير",rem);
}
function statusSelect(t){
  const s=el("select",{class:"st "+(ST[t.status]||ST.todo).c,"aria-label":"حالة: "+t.title});
  for(const o of STATUSES)s.append(el("option",{value:o.v,text:o.l}));
  s.value=t.status||"todo";
  s.addEventListener("change",()=>{const patch={status:s.value};if(s.value==="done")patch.progress=100;saveTask(t.id,patch)});
  return s;
}
function taskRow(t){
  const cls=["task"];if(t.status==="done")cls.push("done");else if(isOverdue(t))cls.push("overdue");else if(isToday(t))cls.push("today");
  const due=el("span",{class:"due num"+(isOverdue(t)?" bad":isToday(t)?" warn":""),text:(isOverdue(t)?"متأخرة · ":"")+dueLabel(t)});
  const meta=el("span",{class:"t-meta"},
    t.owner?el("span",{class:"chip",text:t.owner}):null, due,
    t.priority?el("span",{},el("span",{class:"prio "+t.priority})," "+PRIO[t.priority].l):null,
    t.upd_count?el("span",{text:t.upd_count+" تحديث"}):null);
  const check=el("button",{type:"button",class:"check","aria-label":t.status==="done"?"إرجاع المهمة مفتوحة":"تعليم المهمة كمنجزة",onclick:()=>saveTask(t.id,t.status==="done"?{status:"doing"}:{status:"done",progress:100})},t.status==="done"?"✓":"");
  const prog=Number(t.status==="done"?100:t.progress)||0;
  return el("div",{class:cls.join(" ")},check,
    el("button",{type:"button",class:"t-main",onclick:()=>openTask(t.id)},el("span",{class:"t-title",text:t.title||"(بدون عنوان)"}),meta),
    el("div",{class:"t-side"},el("span",{class:"pbar",title:prog+"%"},el("i",{style:"width:"+prog+"%"})),statusSelect(t)));
}
function renderBoard(){
  const board=$("board");
  if(!loaded){board.replaceChildren(el("div",{class:"empty"},el("h3",{text:"جارٍ تحميل مهام الفريق"})));return}
  if(!tasks.length){board.replaceChildren(el("div",{class:"empty"},el("h3",{text:"ما فيه مهام لسه"}),el("span",{text:"اضغط \"+ مهمة جديدة\" وأضف أول مهمة للفريق."})));return}
  const list=sortTasks(filtered());
  if(!list.length){board.replaceChildren(el("div",{class:"empty"},el("h3",{text:"ما فيه مهام تطابق الفلاتر"}),el("button",{type:"button",class:"btn",text:"مسح الفلاتر",onclick:clearFilters})));return}
  const groups=new Map();
  for(const t of list){const k=t.area||"بدون محور";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)}
  const frag=document.createDocumentFragment();
  for(const [area,items] of groups){
    const done=items.filter(t=>t.status==="done").length;
    frag.append(el("section",{class:"group"},el("div",{class:"group-h"},el("h2",{text:area}),el("span",{class:"num",text:done+" من "+items.length+" منجزة"})),el("div",{class:"list"},...items.map(taskRow))));
  }
  board.replaceChildren(frag);
}
function clearFilters(){$("q").value="";$("fStatus").value="";$("fArea").value="";$("fOwner").value="";tileFilter="";render()}

/* ---------- writes ---------- */
async function saveTask(id,patch){
  // optimistic: show the change at once, then confirm from the server
  const i=tasks.findIndex(t=>t.id===id);
  if(i>=0){tasks[i]={...tasks[i],...patch};render()}
  try{const row=await rpc("save_task",{p_task:{id,...patch},p_by:myName});const j=tasks.findIndex(t=>t.id===id);if(j>=0)tasks[j]=row;render();return true}
  catch(e){onErr(e);load(true);return false}
}
async function createTask(data){
  try{const row=await rpc("save_task",{p_task:data,p_by:myName});tasks.push(row);refreshFilterOptions();render();return row.id}
  catch(e){onErr(e);return null}
}

/* ---------- calendar ---------- */
function evTimes(t){const d=dueAt(t);if(!d)return null;const start=t.due_time?d:new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0);return {start,end:new Date(start.getTime()+30*60e3)}}
const icsStamp=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+"T"+pad(x.getHours())+pad(x.getMinutes())+"00";
function calendarUrl(t){
  const tm=evTimes(t);if(!tm)return null;
  const p=new URLSearchParams({action:"TEMPLATE",text:t.title||"مهمة",dates:icsStamp(tm.start)+"/"+icsStamp(tm.end),details:(t.notes||"")+"\nمن منصة مهام تسويق التويجري"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function downloadFile(name,text,type){const blob=new Blob([text],{type});const a=el("a",{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function downloadIcs(t){
  const tm=evTimes(t);if(!tm)return;
  const esc=s=>String(s||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const trig={at:"PT0M","1h":"-PT1H","1d":"-P1D"}[t.reminder]||"-PT1H";
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Altuwijri//Marketing Tasks//AR","BEGIN:VEVENT",
    "UID:"+(t.id||Date.now())+"@altuwijri-tasks","DTSTAMP:"+icsStamp(new Date()),
    "DTSTART:"+icsStamp(tm.start),"DTEND:"+icsStamp(tm.end),"SUMMARY:"+esc(t.title),"DESCRIPTION:"+esc(t.notes),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(t.title),"TRIGGER:"+trig,"END:VALARM","END:VEVENT","END:VCALENDAR"];
  downloadFile("مهمة-"+(t.due||"")+".ics",lines.join("\r\n"),"text/calendar");
}

/* ---------- dialog ---------- */
function readForm(){
  return {title:$("fTitle").value.trim(),area:$("fAreaIn").value.trim(),owner:$("fOwnerIn").value.trim(),status:$("fStatusIn").value,priority:$("fPrioIn").value,
    start_date:$("fStart").value,due:$("fDue").value,due_time:$("fTime").value,reminder:$("fRem").value,progress:Number($("fProg").value),notes:$("fNotes").value.trim()};
}
function updateCal(){const t=readForm();const u=calendarUrl(t);$("calRow").hidden=!u;if(u)$("calLink").href=u}
function openTask(id){
  editing=id||null;
  const t=id?tasks.find(x=>x.id===id):null;
  if(id&&!t)return;
  $("dlgTitle").textContent=t?"تفاصيل المهمة":"مهمة جديدة";
  fillSelect($("fStatusIn"),STATUSES.map(s=>[s.v,s.l]));
  $("fTitle").value=t?t.title||"":"";
  $("fAreaIn").value=t?t.area||"":($("fArea").value||"");
  $("fOwnerIn").value=t?t.owner||"":($("fOwner").value||"");
  $("fStatusIn").value=t?t.status||"todo":"todo";
  $("fPrioIn").value=t?t.priority||"":"";
  $("fStart").value=t?t.start_date||"":todayIso();
  $("fDue").value=t?t.due||"":"";
  $("fTime").value=t?t.due_time||"":"";
  $("fRem").value=t?t.reminder||"none":"1d";
  $("fProg").value=t?Number(t.progress)||0:0;$("fProgV").textContent=$("fProg").value+"%";
  $("fNotes").value=t?t.notes||"":"";
  $("btnDel").hidden=!t;$("delConfirm").hidden=true;
  $("updSec").hidden=!t;$("updList").replaceChildren();$("updText").value="";
  $("audit").textContent="";
  updateCal();
  if(t){loadUpdates(t.id);renderAudit(t)}
  $("dlg").showModal();
  if(!t)$("fTitle").focus();
}
function renderAudit(t){
  $("audit").textContent=t.updated_at?"آخر تحديث"+(t.updated_by?" بواسطة "+t.updated_by:"")+" · "+fmtDT(t.updated_at):"";
}
function closeDlg(){editing=null;if($("dlg").open)$("dlg").close()}
async function loadUpdates(id){
  try{
    const items=await rpc("list_updates",{p_task:id});
    if(editing!==id)return;
    $("updList").replaceChildren(...(items.length?items.map(u=>el("div",{class:"upd"},el("span",{text:u.body}),el("span",{class:"who",text:(u.by_name||"عضو في الفريق")+" · "+fmtDT(u.at)}))):[el("div",{class:"audit",text:"ما فيه تحديثات لسه. سجّل هنا كل خطوة تمت على المهمة."})]));
  }catch(e){if(e instanceof BadCode)onErr(e)}
}
async function addUpdate(){
  const text=$("updText").value.trim();if(!text||!editing)return;
  const id=editing;$("updBtn").disabled=true;
  try{await rpc("add_update",{p_task:id,p_body:text,p_by:myName});$("updText").value="";await loadUpdates(id);load(true)}
  catch(e){onErr(e)}
  $("updBtn").disabled=false;
}

/* ---------- export ---------- */
function exportCsv(){
  const head=["المهمة","المحور","المسؤول","الحالة","الأولوية","تاريخ البدء","الاستحقاق","الوقت","نسبة الإنجاز","متأخرة","آخر تحديث بواسطة","ملاحظات"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=sortTasks(tasks).map(t=>[t.title,t.area,t.owner,(ST[t.status]||ST.todo).l,t.priority?PRIO[t.priority].l:"",t.start_date,t.due,t.due_time,(t.status==="done"?100:t.progress||0)+"%",isOverdue(t)?"نعم":"",t.updated_by,t.notes]);
  downloadFile("تقرير-مهام-التسويق-"+todayIso()+".csv","﻿"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");
}

/* ---------- gate ---------- */
function showGate(msg){
  stopPolling();$("app").hidden=true;$("gate").hidden=false;
  $("gName").value=myName||lsGet(LS_NAME);$("gCode").value="";
  $("gErr").hidden=!msg;$("gErr").textContent=msg||"";
  setTimeout(()=>($("gName").value?$("gCode"):$("gName")).focus(),0);
}
function showApp(){
  $("gate").hidden=true;$("app").hidden=false;
  $("whoami").textContent="· "+myName;
  render();load();startPolling();
}
function logout(msg){code="";lsSet(LS_CODE,"");tasks=[];loaded=false;closeDlg();showGate(msg)}
$("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const c=$("gCode").value.trim(),n=$("gName").value.trim();if(!c||!n)return;
  $("gBtn").disabled=true;$("gErr").hidden=true;
  code=c;
  try{await rpc("check_code",{});myName=n;lsSet(LS_CODE,c);lsSet(LS_NAME,n);showApp()}
  catch(err){code="";$("gErr").hidden=false;$("gErr").textContent=err instanceof BadCode?"الكود غير صحيح.":"ما قدرنا نتصل، تأكد من الإنترنت."}
  $("gBtn").disabled=false;
});

/* ---------- events ---------- */
["q","fStatus","fArea","fOwner","fSort"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",render));
$("btnClear").addEventListener("click",clearFilters);
$("btnAdd").addEventListener("click",()=>openTask(null));
$("btnExport").addEventListener("click",exportCsv);
$("btnLogout").addEventListener("click",()=>logout(""));
$("dlgClose").addEventListener("click",closeDlg);
$("btnCancel").addEventListener("click",closeDlg);
$("dlg").addEventListener("close",()=>{editing=null});
$("fProg").addEventListener("input",()=>$("fProgV").textContent=$("fProg").value+"%");
["fTitle","fDue","fTime","fNotes","fRem"].forEach(id=>$(id).addEventListener("change",updateCal));
$("btnIcs").addEventListener("click",()=>downloadIcs({...readForm(),id:editing}));
$("updBtn").addEventListener("click",addUpdate);
$("updText").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addUpdate()}});
$("btnDel").addEventListener("click",()=>{$("delConfirm").hidden=false;$("btnDel").hidden=true});
$("delNo").addEventListener("click",()=>{$("delConfirm").hidden=true;$("btnDel").hidden=false});
$("delYes").addEventListener("click",async()=>{
  const id=editing;if(!id)return;
  try{await rpc("delete_task",{p_id:id});tasks=tasks.filter(t=>t.id!==id);closeDlg();render();toast("تم حذف المهمة")}catch(e){onErr(e)}
});
$("taskForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const data=readForm();if(!data.title){$("fTitle").focus();return}
  if(data.status==="done")data.progress=100;
  $("btnSave").disabled=true;
  const wasEdit=!!editing;
  const ok=wasEdit?await saveTask(editing,data):!!(await createTask(data));
  $("btnSave").disabled=false;
  if(ok){closeDlg();toast(wasEdit?"تم حفظ التعديل":"تمت إضافة المهمة")}
});
setInterval(()=>{if(loaded&&!$("app").hidden)render()},60e3); // refresh overdue/today labels

/* ---------- boot ---------- */
if(!CFG.supabaseUrl||!CFG.supabaseAnonKey){
  $("gate").hidden=false;$("gateForm").replaceChildren(el("h1",{text:"الصفحة تحتاج إعداد"}),el("p",{text:"أضف رابط Supabase والمفتاح في أعلى ملف index.html (APP_CONFIG)."}));
}else{
  code=lsGet(LS_CODE);myName=lsGet(LS_NAME);
  if(code&&myName)showApp();else showGate("");
}
})();
</script>
